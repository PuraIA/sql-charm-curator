#
# Canonical host: www.prettyformat.com
#
# TLS terminates upstream (Cloudflare), so these servers listen on plain HTTP and the
# redirects are written with an absolute https:// target.
#
# Three things this config is responsible for, beyond serving files:
#   1. every hostname other than www. redirects to www., so one page is not served
#      from five different origins;
#   2. unknown paths return a real 404 instead of 200 with the app shell;
#   3. each route is served from its own prerendered HTML file (dist/<route>/index.html).
#

# Tool subdomains map to the equivalent path on the canonical host.
map $host $subdomain_tool {
    default                /;
    sql.prettyformat.com   /sql;
    json.prettyformat.com  /json;
    xml.prettyformat.com   /xml;
}

# Cache policy is decided here rather than with per-location `add_header`, because an
# `add_header` inside a location discards every `add_header` inherited from the server
# block — which would silently drop the security headers on exactly the HTML responses
# that need them. Keeping all add_header directives at one level avoids that.
map $uri $cache_control {
    default                                                    "no-cache, must-revalidate";
    ~^/assets/                                                 "public, max-age=31536000, immutable";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$  "public, max-age=31536000, immutable";
    ~^/(ads\.txt|sitemap\.xml|robots\.txt)$                     "public, max-age=86400";
    /404.html                                                  "no-store";
}

# sql./json./xml. -> www.prettyformat.com/<tool>
server {
    listen 80;
    server_name sql.prettyformat.com json.prettyformat.com xml.prettyformat.com;
    return 301 https://www.prettyformat.com$subdomain_tool;
}

# Apex and any other subdomain -> www, preserving the path.
server {
    listen 80;
    server_name prettyformat.com *.prettyformat.com;
    return 301 https://www.prettyformat.com$request_uri;
}

# Canonical host.
server {
    listen 80 default_server;
    server_name www.prettyformat.com localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The only add_header directives in this server, so all of them apply everywhere.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    # Enhanced gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Legacy alias, folded into /privacy so only one URL carries the content.
    location = /privacy-policy {
        return 301 https://www.prettyformat.com/privacy;
    }

    # Content-hashed build output: no need to log every hit.
    location /assets/ {
        access_log off;
    }

    location = / {
        try_files /index.html =404;
    }

    # Every valid route has a prerendered <route>/index.html. Anything else is a
    # genuine 404 — the previous `try_files ... /index.html` fallback answered 200
    # for any made-up URL, which is a soft 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
