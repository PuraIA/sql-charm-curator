<head>

  -->
  <!--seo:start-->

  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <meta property="og:description"

  <meta name="author" content="Pura IA — pura.ia.br" />

  <meta property="og:locale:alternate" content="pt_BR" />
  <meta property="og:locale:alternate" content="es_ES" />
  <meta property="og:locale:alternate" content="de_DE" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:locale:alternate" content="zh_CN" />

  <!-- Twitter (route-independent) -->

  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect and DNS prefetch to improve performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="preconnect" href="https://www.pura.ia.br" />

  <!-- Critical CSS inline to prevent render blocking -->
  <style>
    /* Critical above-the-fold styles */
    *,
    ::before,
    ::after {
      box-sizing: border-box;
      border-width: 0;
      border-style: solid;
      border-color: hsl(var(--border))
    }

    html {
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      tab-size: 4;
      font-family: ui-sans-serif, system-ui, sans-serif
    }

    body {
      margin: 0;
      line-height: inherit;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased
    }

    :root {
      --background: 0 0% 100%;
      --foreground: 222 47% 11%;
      --card: 0 0% 100%;
      --card-foreground: 222 47% 11%;
      --primary: 199 89% 48%;
      --primary-foreground: 210 40% 98%;
      --border: 214.3 31.8% 91.4%;
      --radius: 0.75rem
    }

    .dark {
      --background: 222 47% 4%;
      --foreground: 210 40% 98%;
      --card: 222 47% 4%;
      --card-foreground: 210 40% 98%;
      --primary: 199 89% 48%;
      --primary-foreground: 210 40% 98%;
      --border: 222 47% 11%
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    /* Prevent layout shift */
    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace
    }
  </style>

  <!-- Preload critical fonts -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    as="style" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
  </noscript>

  <!-- Google AdSense — loaded immediately for crawler detection -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4026555335042993" crossorigin="anonymous"></script>

  <!-- Third-party scripts lazy loader to reduce unused JS and block-time -->
  <script>
    (function () {
      const lazyScripts = [
        { src: 'https://www.googletagmanager.com/gtag/js?id=G-EV2WK1EQNE', attr: { async: '' } }
      ];

      let scriptsLoaded = false;

      function loadScripts() {
        if (scriptsLoaded) return;
        scriptsLoaded = true;

        lazyScripts.forEach(cfg => {
          const s = document.createElement('script');
          s.src = cfg.src;
          if (cfg.attr) {
            Object.keys(cfg.attr).forEach(key => s.setAttribute(key, cfg.attr[key]));
          }
          document.head.appendChild(s);
        });

        // Initialize Gtag after loading
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EV2WK1EQNE', {
          'page_path': window.location.pathname,
          'send_page_view': true
        });
      }

      // Load on first user interaction or after a 5s delay
      const events = ['mouseover', 'keydown', 'touchmove', 'touchstart', 'scroll'];
      events.forEach(e => window.addEventListener(e, loadScripts, { once: true, passive: true }));
      setTimeout(loadScripts, 5000);

      // Register Service Worker for offline support and asset caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js');
        });
      }
    })();
  </script>
</head>

<body>

        the guides and reference material on this page are fully readable without it.</p>
    </div>
  </noscript>
  <!--
    The build-time prerender replaces the marker below with the fully rendered page
    for each route. In dev it stays empty and React renders on the client.
  -->
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
