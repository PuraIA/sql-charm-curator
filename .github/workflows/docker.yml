name: Docker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sql-charm-curator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8080:80 --name sql-charm-curator-ci sql-charm-curator:ci
          for i in {1..10}; do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Container responded successfully"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not respond in time"
          docker logs sql-charm-curator-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop sql-charm-curator-ci || true
